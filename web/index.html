<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DroidBridge</title>
<script>
// 主题（跟随系统 / 深色 / 浅色）记在浏览器里；放在样式前面，页面一出来就是对的颜色
(function () {
  var s = null;
  try { s = localStorage.getItem('db_theme'); } catch (e) {}
  document.documentElement.dataset.theme = s === 'dark' || s === 'light' ? s : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="titlebar" id="titlebar" hidden></header>
<div class="topbar">
  <button class="ib back" id="mBack"></button>
  <span class="logo" id="mLogo"></span><span id="mTitle">DroidBridge</span>
  <button class="ib" id="mBatch"></button><button class="ib" id="mGallery"></button>
  <button class="ib gear" id="mGear"></button>
</div>
<aside id="sidebar">
  <div class="brand"><button class="logo side-tog" id="logo" type="button"></button>DroidBridge<button class="ib" id="batch"></button><button class="ib" id="gallery"></button><button class="ib" id="gear"></button></div>
  <div id="sideSearch" hidden></div>
  <div id="noticeSide"></div>
  <div class="lists" id="lists"></div>
  <div class="side-foot" id="sideFoot"></div>
  <div class="side-resizer" id="sideResizer"></div>
</aside>
<main>
  <button class="side-peek side-tog" id="sidePeek" type="button"></button>
  <div id="stageBar" class="stage-bar" hidden></div>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
  <div class="placeholder" id="placeholder"></div>
</main>
<div class="toasts" id="toasts"></div>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/devices.js"></script>
<script src="js/peers.js"></script>
<script src="js/viewer.js"></script>
<script src="js/logcat.js"></script>
<script src="js/audio.js"></script>
<script src="js/gallery.js"></script>
<script src="js/files.js"></script>
<script src="js/update.js"></script>
<script src="js/titlebar.js"></script>
<script src="js/plugins.js"></script>
<script src="js/plugin-sources.js"></script>
<script src="js/contextmenu.js"></script>
<script src="js/access.js"></script>
<!-- 初始化脚本（必须最后加载） -->
<script>
// ---------------- 初始化 ----------------
$('#logo').innerHTML = LOGO_SVG; $('#logo').classList.add('app');
$('#mLogo').innerHTML = LOGO_SVG; $('#mLogo').classList.add('app');
$('#gear').replaceWith(Object.assign(ib('gear', t('设置'), settingsDialog), { id: 'gear' }));
$('#batch').replaceWith(ib('package', t('批量安装 APK'), () => batchInstallDialog()));
$('#mBatch').replaceWith(ib('package', t('批量安装 APK'), () => batchInstallDialog()));
$('#gallery').replaceWith(ib('images', t('相册'), () => openGallery(), 'gal-btn'));
$('#mGear').replaceWith(Object.assign(ib('gear', t('设置'), settingsDialog), { id: 'mGear' }));
$('#mGallery').replaceWith(ib('images', t('相册'), () => openGallery(), 'gear gal-btn'));
$('#mBack').innerHTML = svg('chevLeft');
$('#mBack').onclick = () => document.body.classList.remove('viewing');
setupTitlebar();
initSidebarLayout();
$('#placeholder').append(h('span', { html: svg('phone') }).firstChild, h('div', {}, t('选择设备开始投屏')), t('设备需开启 USB 调试并连接到电脑'));
addEventListener('resize', () => { for (const v of viewers.values()) v.fit(); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) toast(t('把文件拖到设备画面上即可安装或传输')); });
addEventListener('beforeunload', () => { for (const v of viewers.values()) if (v.recording) v.stopRecord(); });

(async function init() {
  try {
    INFO = await api('/api/info');
    document.title = 'DroidBridge · ' + INFO.name;
    setTitlebarVersion();
  } catch (e) { toast(t('无法连接 DroidBridge：') + e.message, { kind: 'bad', ms: 5000 }); }
  if (!window.VideoDecoder || !isSecureContext) showNotice();
  await refreshAll();
  pluginsInit();
  const m = location.hash.match(/^#open=([^|]+)\|(.+)$/);
  if (m) {
    const hst = hosts.get(decodeURIComponent(m[1])), serial = decodeURIComponent(m[2]);
    if (hst) openViewer(hst, (hst.devices || []).find(d => d.serial === serial) || { serial, model: '', state: 'device' });
  }
  setInterval(() => { if (!document.hidden) refreshAll(); }, 4000);
  if (isLocalHost()) {
    checkUpdate();
    // 一直开着的窗口也能收到新版本提示：每 6 小时再检查一次
    setInterval(() => { if (!(UPDATE && UPDATE.newer)) checkUpdate(); }, 6 * 3600e3);
  }
})();
</script>
</body>
</html>
