<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DroidBridge</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="topbar">
  <button class="ib back" id="mBack"></button>
  <span class="logo" id="mLogo"></span><span id="mTitle">DroidBridge</span>
  <button class="ib" id="mBatch"></button><button class="ib" id="mGallery"></button>
  <button class="ib gear" id="mGear"></button>
</div>
<aside>
  <div class="brand"><span class="logo" id="logo"></span>DroidBridge<button class="ib" id="batch"></button><button class="ib" id="gallery"></button><button class="ib" id="gear"></button></div>
  <div id="noticeSide"></div>
  <div class="lists" id="lists"></div>
</aside>
<main>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
  <div class="placeholder" id="placeholder"></div>
</main>
<div class="toasts" id="toasts"></div>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/devices.js"></script>
<script src="js/peers.js"></script>
<script src="js/viewer.js"></script>
<script src="js/logcat.js"></script>
<script src="js/audio.js"></script>
<script src="js/gallery.js"></script>
<!-- 初始化脚本（必须最后加载） -->
<script>
// ---------------- 初始化 ----------------
$('#logo').innerHTML = svg('phone');
$('#mLogo').innerHTML = svg('phone');
$('#gear').replaceWith(ib('gear', t('设置'), settingsDialog));
$('#batch').replaceWith(ib('package', t('批量安装 APK'), () => batchInstallDialog()));
$('#mBatch').replaceWith(ib('package', t('批量安装 APK'), () => batchInstallDialog()));
$('#gallery').replaceWith(ib('images', t('相册'), () => openGallery()));
$('#mGear').replaceWith(ib('gear', t('设置'), settingsDialog));
$('#mGallery').replaceWith(ib('images', t('相册'), () => openGallery(), 'gear'));
$('#mBack').innerHTML = svg('chevLeft');
$('#mBack').onclick = () => document.body.classList.remove('viewing');
$('#placeholder').append(h('span', { html: svg('phone') }).firstChild, h('div', {}, t('选择设备开始投屏')), t('设备需开启 USB 调试并连接到电脑'));
addEventListener('resize', () => { for (const v of viewers.values()) v.fit(); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) toast(t('把文件拖到设备画面上即可安装或传输')); });
addEventListener('beforeunload', () => { for (const v of viewers.values()) if (v.recording) v.stopRecord(); });

(async function init() {
  try {
    INFO = await api('/api/info');
    document.title = 'DroidBridge · ' + INFO.name;
  } catch (e) { toast(t('无法连接 DroidBridge：') + e.message, { kind: 'bad', ms: 5000 }); }
  if (!window.VideoDecoder || !isSecureContext) showNotice();
  await refreshAll();
  const m = location.hash.match(/^#open=([^|]+)\|(.+)$/);
  if (m) {
    const hst = hosts.get(decodeURIComponent(m[1])), serial = decodeURIComponent(m[2]);
    if (hst) openViewer(hst, (hst.devices || []).find(d => d.serial === serial) || { serial, model: '', state: 'device' });
  }
  setInterval(() => { if (!document.hidden) refreshAll(); }, 4000);
})();
</script>
</body>
</html>
