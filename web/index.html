<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DroidBridge</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0e1013;--side:#121418;--surface:#16191e;--raised:#1c1f25;--hover:rgba(255,255,255,.05);--active:rgba(91,141,239,.13);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#e6e8ec;--sub:#9aa1ad;--faint:#636a76;
  --accent:#5b8def;--ok:#3fb27f;--warn:#d6a03c;--bad:#e5534b;--shadow:0 10px 32px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#f6f7f9;--side:#eef0f3;--surface:#fff;--raised:#fff;--hover:rgba(0,0,0,.045);--active:rgba(59,111,224,.10);
  --line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.14);--text:#1d2129;--sub:#5d6470;--faint:#9ba1ab;
  --accent:#3b6fe0;--ok:#2e9e6b;--warn:#c28a1f;--bad:#d64541;--shadow:0 10px 32px rgba(0,0,0,.14);
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
svg{display:block;flex:none}
body{display:flex}

/* 图标按钮 */
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--sub);padding:0;flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib svg{width:16px;height:16px}
.ib.on{color:var(--accent);background:var(--active)}
.ib:disabled{opacity:.35;cursor:default;background:none}

/* 按钮与表单 */
.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.input,.select{width:100%;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color:var(--text);outline:none}
.input:focus,.select:focus{border-color:var(--accent)}
.input::placeholder{color:var(--faint)}

/* 侧栏 */
aside{width:252px;flex:none;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px 0 16px;font-weight:600;font-size:14px}
.brand .logo{color:var(--accent)}
.brand .logo svg{width:18px;height:18px}
.brand .ib{margin-left:auto}
.lists{flex:1;overflow:auto;padding:0 8px 16px}
.sec{display:flex;align-items:center;height:28px;margin-top:14px;padding:0 4px 0 8px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em}
.sec:first-child{margin-top:4px}
.sec .ib{margin-left:auto;width:24px;height:24px}
.sec .ib svg{width:15px;height:15px}
.host{display:flex;align-items:center;gap:6px;height:30px;margin-top:4px;padding:0 4px 0 8px;font-size:12px}
.host .hn{color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.host .meta{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.host .meta.err{color:var(--bad)}
.host .ib{width:24px;height:24px;opacity:0}
.host:hover .ib,.host .ib[aria-expanded=true]{opacity:1}
@media (hover:none){.host .ib{opacity:1}}
.dev{position:relative;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;user-select:none}
.dev:hover{background:var(--hover)}
.dev.open{background:var(--active)}
.dev.open::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.dev .t{flex:1;min-width:0}
.dev b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev small{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev.na b{color:var(--sub)}
.dev .st{font-size:11px;color:var(--warn);flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.empty{padding:4px 8px;color:var(--faint);font-size:12px}
.empty.err{color:var(--bad)}

/* 主区域 */
main{flex:1;min-width:0;min-height:100vh;padding:16px;display:flex;flex-direction:column}
.grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.placeholder{margin:auto;text-align:center;color:var(--faint);padding:40px 16px}
.placeholder svg{width:36px;height:36px;margin:0 auto 12px;stroke-width:1.25}
.placeholder div{color:var(--sub);font-size:14px;margin-bottom:4px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--sub);font-size:12px}
.notice svg{width:16px;height:16px;color:var(--warn);margin-top:1px}

/* 查看器 */
.viewer{width:320px;max-width:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vhead{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;border-bottom:1px solid var(--line)}
.vhead .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vhead .sub{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.vhead .fps{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.vbody{display:flex}
.vmain{display:flex;min-width:0}
.vmain>.vbody{flex:1;min-width:0}
.vlog{display:none;position:relative;flex:none;min-width:0;border-left:1px solid var(--line)}
.viewer.with-log .vlog{display:block}
.viewer.log-bottom .vmain{flex-direction:column}
.viewer.log-bottom .vlog{width:auto !important;height:38vh;border-left:0;border-top:1px solid var(--line)}
.viewer.log-bottom .screen canvas{max-height:calc(62vh - 150px)}
.lpanel{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.lhead{display:flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 12px;border-bottom:1px solid var(--line);flex:none}
.ltitle{font-weight:600;font-size:12px}
.lstate{flex:1;min-width:0;margin-left:8px;color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.lbar .input,.lbar .select{height:28px;padding:0 8px;font-size:12px}
.lbar .select{width:auto;flex:none;padding-right:4px}
.lbar .q{flex:1.3;min-width:0}
.lapp{position:relative;flex:1;min-width:0}
.lapp .input{padding-right:30px}
.lapp .ib{position:absolute;top:1px;right:1px;width:26px;height:26px}
.lbody{flex:1;min-height:0;overflow:auto;padding:4px 0;background:var(--bg);font:11px/1.55 Consolas,"SF Mono",Menlo,monospace}
.ll{padding:0 10px;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.ll .lt{color:var(--faint)}
.ll b{font-weight:700}
.ll.l0,.ll.l1{color:var(--sub)}
.ll.l3{color:var(--warn)}
.ll.l4,.ll.l5{color:var(--bad)}
.ll.lm{color:var(--faint)}
.ljump{position:absolute;right:14px;bottom:12px;height:26px;padding:0 10px;border:1px solid var(--line2);border-radius:13px;background:var(--raised);color:var(--text);font-size:11px;box-shadow:var(--shadow)}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column}
.screen{position:relative;display:flex;justify-content:center;align-items:center;min-height:260px;background:#000}
.screen canvas{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 150px);touch-action:none;outline:none;cursor:default;user-select:none;-webkit-user-select:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#c4c9d1;font-size:12px;background:rgba(0,0,0,.6);word-break:break-word}
.overlay.hide{display:none}
.overlay .btn{color:#fff;border-color:rgba(255,255,255,.25)}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drop{position:absolute;inset:8px;display:none;align-items:center;justify-content:center;border:1.5px dashed var(--accent);border-radius:8px;background:rgba(91,141,239,.16);color:#fff;font-size:13px;pointer-events:none}
.viewer.dropping .drop{display:flex}
.nav{display:flex;justify-content:space-evenly;align-items:center;height:40px;border-top:1px solid var(--line)}
.nav .ib{width:64px;height:30px}
.typing{display:none;gap:6px;padding:8px;border-top:1px solid var(--line)}
.typing.show{display:flex}
.vtools{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-left:1px solid var(--line)}
.vtools .sep{width:18px;height:1px;margin:5px 0;background:var(--line)}
.viewer:fullscreen{width:100vw !important;border:0;border-radius:0;background:#000;justify-content:center}
.viewer:fullscreen .vhead,.viewer:fullscreen .vtools,.viewer:fullscreen .typing{display:none}
.viewer:fullscreen .vbody,.viewer:fullscreen .vcol,.viewer:fullscreen .screen{flex:1}
.viewer:fullscreen .screen canvas{max-height:calc(100vh - 40px)}
.viewer:fullscreen .nav{background:var(--surface)}

/* 菜单、对话框、提示 */
.menu{position:fixed;z-index:50;min-width:176px;padding:4px;background:var(--raised);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;border-radius:5px;background:none;text-align:left;white-space:nowrap}
.menu button:hover{background:var(--hover)}
.menu button svg{width:15px;height:15px;color:var(--sub)}
.menu button.danger,.menu button.danger svg{color:var(--bad)}
.menu .sep{height:1px;margin:4px 6px;background:var(--line)}
dialog{width:min(400px,calc(100vw - 32px));padding:0;border:1px solid var(--line);border-radius:12px;background:var(--raised);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{padding:20px 20px 0;font-size:15px;font-weight:600}
.dlg-d{padding:4px 20px 0;color:var(--sub);font-size:12px}
.dlg-b{display:grid;gap:14px;padding:16px 20px 4px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px 20px}
.field>label{display:block;margin-bottom:6px;color:var(--sub);font-size:12px}
.field .hint{margin-top:5px;color:var(--faint);font-size:11px}
.dlg-err{color:var(--bad);font-size:12px;min-height:0}
.dlg-err:empty{display:none}
.group{display:grid;gap:2px}
.group-t{margin:6px 0 4px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.row>span{color:var(--sub)}
.row .select{width:150px;height:30px}
.addr{display:flex;align-items:center;gap:6px;font-family:Consolas,"SF Mono",monospace;font-size:12px}
.switch{position:relative;width:32px;height:18px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:9px;background:var(--line2);transition:.15s;pointer-events:none}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(14px)}
.steps{margin:0;padding-left:18px;color:var(--sub);display:grid;gap:6px}
.steps b{color:var(--text);font-weight:500}
.foot{color:var(--faint);font-size:11px}
.steps2{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:10px;color:var(--sub)}
.step.cur{color:var(--text)}
.step>span:first-child{width:16px;height:16px;display:grid;place-items:center;flex:none}
.step svg{width:14px;height:14px}
.st-ok{color:var(--ok)}.st-bad{color:var(--bad)}
.spin.sm{width:12px;height:12px;border-width:1.5px;border-color:var(--line2);border-top-color:var(--accent)}
.logline{min-height:16px;color:var(--faint);font:11px/1.4 Consolas,"SF Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logbox{margin:0;max-height:220px;overflow:auto;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--sub);font:11px/1.5 Consolas,"SF Mono",monospace;white-space:pre-wrap;word-break:break-all}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:12px}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;max-width:min(480px,calc(100vw - 32px));padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--raised);box-shadow:var(--shadow);font-size:12px}
.toast .dot{width:6px;height:6px}

/* 顶栏（仅窄屏） */
.topbar{display:none}

@media (max-width:720px){
  body{display:block}
  .topbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:10;height:48px;padding:0 8px 0 12px;background:var(--side);border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
  .topbar .logo{color:var(--accent)}
  .topbar .logo svg{width:18px;height:18px}
  .topbar .back{display:none;margin-left:-6px}
  body.viewing .topbar .back{display:inline-grid}
  body.viewing .topbar .logo{display:none}
  .topbar .gear{margin-left:auto}
  aside{width:auto;height:auto;position:static;border-right:0;background:none}
  aside .brand{display:none}
  .lists{padding:4px 8px 24px}
  .dev{padding:9px 8px}
  main{min-height:0;padding:8px;display:none}
  body.viewing aside{display:none}
  body.viewing main{display:flex}
  .viewer{width:100% !important}
  .vbody{flex-direction:column}
  .vmain{flex-direction:column}
  .vlog{width:auto !important;height:45dvh;border-left:0;border-top:1px solid var(--line)}
  .vtools{width:auto;flex-direction:row;justify-content:space-between;padding:4px 8px;border-left:0;border-top:1px solid var(--line);overflow-x:auto}
  .vtools .sep{width:1px;height:18px;margin:0 2px}
  .screen canvas{max-height:calc(100dvh - 190px)}
  .notice{margin:8px 8px 0}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="ib back" id="mBack"></button>
  <span class="logo" id="mLogo"></span><span id="mTitle">DroidBridge</span>
  <button class="ib gear" id="mGear"></button>
</div>
<aside>
  <div class="brand"><span class="logo" id="logo"></span>DroidBridge<button class="ib" id="gear"></button></div>
  <div id="noticeSide"></div>
  <div class="lists" id="lists"></div>
</aside>
<main>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
  <div class="placeholder" id="placeholder"></div>
</main>
<div class="toasts" id="toasts"></div>

  const el = h('div', { class: 'toast' }, opt.kind || opt.sticky ? dot : null, label);

  let timer = null;

    set(msg, kind) { label.textContent = msg; dot.className = 'dot' + (kind ? ' ' + kind : ''); if (!dot.isConnected) el.prepend(dot); return api; },

const withToken = (url) => {
  const tk = pref.get('token', '');
  return tk ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(tk) : url;
};
let tokenAsk = null;
async function api(path, opts = {}) {
  const r = await fetch(withToken(path), { ...opts, headers: { 'content-type': 'application/json', 'x-lang': LANG, ...(opts.headers || {}) } });
  let body = null;
  try { body = await r.json(); } catch {}
  if (r.status === 401) {
    tokenAsk = tokenAsk || promptDialog(t('需要访问令牌'), t('这台 DroidBridge 启用了访问令牌。'), { type: 'password', value: pref.get('token', '') }).finally(() => { tokenAsk = null; });
    const tk = await tokenAsk;
    if (tk !== null) { pref.set('token', tk.trim()); return api(path, opts); }
  }
  if (!r.ok) throw new Error((body && body.error) || ('HTTP ' + r.status));
  return body;
}

let INFO = null;
const hosts = new Map();
const viewers = new Map();

async function loadPeers() {
  const peers = await api('/api/peers');
  const ids = new Set(['local', ...peers.map(p => p.id)]);
  for (const id of [...hosts.keys()]) if (!ids.has(id)) hosts.delete(id);
  if (!hosts.has('local')) hosts.set('local', { id: 'local', name: (INFO && INFO.name) || t('本机'), devices: [] });
  for (const p of peers) hosts.set(p.id, Object.assign(hosts.get(p.id) || { devices: [] }, p, { remote: true }));
}
async function refreshHost(hst) {
  try { hst.devices = await api('/api/devices?peer=' + encodeURIComponent(hst.id)); hst.error = null; }
  catch (e) { hst.error = e.message; hst.devices = []; }
  hst.loaded = true;
}
async function refreshAll() {
  try { await loadPeers(); } catch {}
  await Promise.all([...hosts.values()].map(refreshHost));
  renderSide();
}

  if (!hst.loaded) return [h('div', { class: 'empty' }, t('正在读取…'))];

  if (!hst.devices.length) return [emptyEl];
  return hst.devices.map(d => {
    const key = hst.id + '|' + d.serial, ready = d.state === 'device';

    body: formBody,

    onsubmit: async () => {
      err.textContent = '';
      if (sshOn.checked) return runInstall();
      ok.disabled = true; ok.textContent = t('正在连接…');
      try {
        const res = await api(editing ? '/api/peers/' + encodeURIComponent(p.id) : '/api/peers', {

          err.textContent = t('对方电脑上没有运行 DroidBridge。可以打开下面的开关，通过 SSH 自动安装。');
          setSsh(true);
        }
      }
    },
  });
  if (opts.install) setSsh(true);

  // ---- SSH 安装：表单替换为步骤进度 ----
  async function runInstall() {
    ok.disabled = true;
    let job;
    try {
      job = (await api('/api/install', { method: 'POST', body: JSON.stringify({ addr: addr.value, user: sshUser.value.trim(), name: name.value, token: token.value }) })).job;
    } catch (e) { err.textContent = e.message; ok.disabled = false; return; }
    const target = addr.value.trim();
    const stepsEl = h('div', { class: 'steps2' });
    const lastEl = h('div', { class: 'logline' });
    const logEl = h('pre', { class: 'logbox', hidden: true });
    const logBtn = h('button', { class: 'linkbtn', type: 'button', onclick: () => { logEl.hidden = !logEl.hidden; logBtn.textContent = logEl.hidden ? t('查看日志') : t('收起日志'); logEl.scrollTop = logEl.scrollHeight; } }, t('查看日志'));
    const body = $('.dlg-b', dlg);
    body.replaceChildren(stepsEl, lastEl, h('div', {}, logBtn), logEl, err);
    $('.dlg-h', dlg).textContent = t('正在安装到 ') + target;
    const d = $('.dlg-d', dlg); if (d) d.textContent = t('可以关闭窗口，安装会在后台继续。');
    cancel.textContent = t('后台运行');
    ok.hidden = true;
    let since = 0, lines = [];
    const tt = toast(t('正在安装到 ') + target + '…', { sticky: true });
    while (true) {
      let s;
      try { s = await api(`/api/install/${job}?since=${since}`); } catch (e) { await new Promise(r => setTimeout(r, 1500)); continue; }
      since = s.next;
      if (s.log.length) { lines.push(...s.log); if (lines.length > 500) lines = lines.slice(-500); logEl.textContent = lines.join('\n'); logEl.scrollTop = logEl.scrollHeight; lastEl.textContent = lines[lines.length - 1]; }
      stepsEl.replaceChildren(...s.steps.map((name, i) => {
        const last = i === s.steps.length - 1;
        const icon = !last || s.state === 'done' ? h('span', { class: 'st-ok', html: svg('check') })
          : s.state === 'failed' ? h('span', { class: 'st-bad', html: svg('x') }) : h('span', { class: 'spin sm' });
        return h('div', { class: 'step' + (last && s.state === 'running' ? ' cur' : '') }, icon, h('span', {}, name));
      }));
      if (s.state === 'running') { tt.set(t('正在安装到 ') + target + '：' + (s.steps[s.steps.length - 1] || '…')); await new Promise(r => setTimeout(r, 800)); continue; }
      if (s.state === 'done') {
        tt.set(t('已添加 ') + (s.peer && s.peer.name || target), 'ok'); tt.close(3000);
        refreshAll();
        if (dlg.open) dlg.close();
      } else {
        tt.set(t('安装失败：') + s.error, 'bad'); tt.close(6000);
        err.textContent = s.error;
        lastEl.textContent = '';
        cancel.textContent = t('关闭');
      }
      return;
    }
  }
}

function avcCodecString(data) {
  for (let i = 0; i + 4 < data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1) {
      if ((data[i + 3] & 0x1f) === 7 && i + 6 < data.length) {
        const x = b => b.toString(16).padStart(2, '0');
        return 'avc1.' + x(data[i + 4]) + x(data[i + 5]) + x(data[i + 6]);
      }
      i += 2;
    }
  }
  return null;
}
const KEYMAP = { Enter: 66, Backspace: 67, Delete: 112, Tab: 61, ArrowUp: 19, ArrowDown: 20, ArrowLeft: 21, ArrowRight: 22, Home: 122, End: 123, PageUp: 92, PageDown: 93, Insert: 124 };
const AKEY = { BACK: 4, HOME: 3, APP_SWITCH: 187, POWER: 26, VOLUME_UP: 24, VOLUME_DOWN: 25 };

// ---------------- 设备日志（adb logcat） ----------------
const LOG_RE = /^\d\d-\d\d\s+(\d\d:\d\d:\d\d\.\d+)\s+(\d+)\s+\d+\s+([VDIWEFA])\s+(.*)$/;
const LOG_LV = { V: 0, D: 1, I: 2, W: 3, E: 4, F: 5, A: 5 };
const LOG_MAX = 20000, LOG_DOM = 3000;

class LogPanel {
  constructor(v) {
    this.v = v; this.buf = []; this.pkg = ''; this.pids = new Set();
    this.paused = false; this.pending = 0; this.follow = true; this.queue = []; this.words = [];
    this.minLv = +pref.get('loglv', '0');
    const lv = h('select', { class: 'select', title: t('级别'), onchange: () => { this.minLv = +lv.value; pref.set('loglv', lv.value); this.rerender(); } },
      [['0', t('全部')], ['1', t('调试+')], ['2', t('信息+')], ['3', t('警告+')], ['4', t('错误')]].map(([val, l]) => h('option', { value: val }, l)));
    lv.value = String(this.minLv);
    this.qInput = h('input', { class: 'input q', placeholder: t('过滤：关键字或 Tag，-排除'), spellcheck: 'false' });
    let qt = 0;
    this.qInput.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { this.setQuery(this.qInput.value); this.rerender(); }, 150); });
    this.appInput = h('input', { class: 'input', placeholder: t('全部应用'), title: t('只看某个应用：填写包名后回车'), spellcheck: 'false' });
    this.appInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); this.sendPkg(this.appInput.value.trim()); } });
    this.appInput.addEventListener('change', () => this.sendPkg(this.appInput.value.trim()));
    this.stateEl = h('span', { class: 'lstate' });
    this.pauseBtn = ib('pause', t('暂停'), () => this.togglePause());
    this.list = h('div', { class: 'lbody' });
    this.jump = h('button', { class: 'ljump', type: 'button', hidden: true, onclick: () => { this.follow = true; this.list.scrollTop = this.list.scrollHeight; this.jump.hidden = true; } }, t('跳到最新'));
    this.list.addEventListener('scroll', () => {
      this.follow = this.list.scrollTop + this.list.clientHeight >= this.list.scrollHeight - 24;
      this.jump.hidden = this.follow;
    });
    this.el = h('div', { class: 'lpanel' },
      h('div', { class: 'lhead' }, h('span', { class: 'ltitle' }, t('日志')), this.stateEl,
        this.pauseBtn, ib('trash', t('清空'), () => this.clear()), ib('download', t('保存为文件'), () => this.save()), ib('x', t('关闭日志'), () => v.toggleLog(false))),
      h('div', { class: 'lbar' }, lv, this.qInput,
        h('div', { class: 'lapp' }, this.appInput, ib('target', t('只看当前前台应用'), () => this.sendPkg('@top')))),
      this.list, this.jump);
    this.connect();
  }

  connect() {
    if (this.ws) { const w = this.ws; this.ws = null; try { w.close(); } catch {} }
    const p = new URLSearchParams({ serial: this.v.dev.serial, peer: this.v.host.id, lang: LANG });
    const tk = pref.get('token', ''); if (tk) p.set('token', tk);
    const ws = this.ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/logcat?' + p);
    this.ended = false;
    this.setState(t('正在连接…'));
    ws.onopen = () => { this.setState(''); if (this.pkg) this.sendPkg(this.pkg); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'lines') this.add(m.l);
      else if (m.type === 'filter') this.onFilter(m);
      else if (m.type === 'notice') toast(m.msg);
      else if (m.type === 'end') { this.ended = true; this.setState(m.msg, true); }
    };
    ws.onclose = () => { if (this.ws === ws && !this.ended) this.setState(t('日志连接已断开'), true); };
  }
  destroy() { const w = this.ws; this.ws = null; if (w) try { w.close(); } catch {} }

  setState(text, retry) {
    this.stateEl.replaceChildren(text, retry ? h('button', { class: 'linkbtn', type: 'button', onclick: () => this.connect() }, t(' 重连')) : '');
    this.stateEl.title = text;
  }
  updateState() {
    const parts = [];
    if (this.pkg) parts.push(this.pids.size ? this.pkg : this.pkg + t('（未运行）'));
    if (this.paused) parts.push(t('已暂停{0}', this.pending ? t(' · 新增 {0} 行', this.pending) : ''));
    this.setState(parts.join(' · '));
  }

  sendPkg(name) {
    if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify({ t: 'pkg', name }));
  }
  onFilter(m) {
    if (m.pkg !== this.pkg) { this.pkg = m.pkg; this.pids = new Set(); }
    // 记住应用历次的进程号，重启后之前的日志仍然可见
    for (const p of m.pids) this.pids.add(p);
    if (document.activeElement !== this.appInput) this.appInput.value = m.pkg;
    this.updateState();
    this.rerender();
  }

  setQuery(s) {
    this.words = s.toLowerCase().split(/\s+/).filter(Boolean).map(w => w.startsWith('-') && w.length > 1 ? { neg: true, w: w.slice(1) } : { neg: false, w });
  }
  parse(raw) {
    const m = LOG_RE.exec(raw);
    return m ? { raw, t: m[1], pid: +m[2], lc: m[3], lv: LOG_LV[m[3]], msg: m[4] } : { raw, t: '', pid: 0, lc: '', lv: -1, msg: raw };
  }
  match(e) {
    if (e.lv >= 0 && e.lv < this.minLv) return false;
    if (e.lv < 0 && (this.minLv > 0 || this.pkg)) return false;
    if (this.pkg && !this.pids.has(e.pid) && !e.raw.includes(this.pkg)) return false;
    if (this.words.length) {
      const low = e.low || (e.low = e.raw.toLowerCase());
      for (const { neg, w } of this.words) if (low.includes(w) === neg) return false;
    }
    return true;
  }
  row(e) {
    if (e.lv < 0) return h('div', { class: 'll lm' }, e.msg);
    return h('div', { class: 'll l' + e.lv }, h('span', { class: 'lt' }, e.t), ' ', h('b', {}, e.lc), ' ', e.msg);
  }

  add(lines) {
    for (const raw of lines) {
      const e = this.parse(raw);
      this.buf.push(e);
      if (this.match(e)) { if (this.paused) this.pending++; else this.queue.push(e); }
    }
    if (this.buf.length > LOG_MAX) this.buf.splice(0, this.buf.length - LOG_MAX);
    if (this.paused) { this.updateState(); return; }
    if (!this.raf) this.raf = requestAnimationFrame(() => this.flush());
  }
  flush() {
    this.raf = 0;
    const q = this.queue.length > LOG_DOM ? this.queue.slice(-LOG_DOM) : this.queue;
    this.queue = [];
    if (!q.length) return;
    const frag = document.createDocumentFragment();
    for (const e of q) frag.append(this.row(e));
    this.list.append(frag);
    let extra = this.list.childElementCount - LOG_DOM;
    while (extra-- > 0) this.list.firstChild.remove();
    if (this.follow) this.list.scrollTop = this.list.scrollHeight;
  }
  rerender() {
    this.queue = [];
    const out = [];
    for (let i = this.buf.length - 1; i >= 0 && out.length < LOG_DOM; i--) if (this.match(this.buf[i])) out.push(this.buf[i]);
    const frag = document.createDocumentFragment();
    for (let i = out.length - 1; i >= 0; i--) frag.append(this.row(out[i]));
    this.list.replaceChildren(frag);
    this.follow = true; this.jump.hidden = true;
    this.list.scrollTop = this.list.scrollHeight;
  }
  togglePause() {
    this.paused = !this.paused;
    this.pauseBtn.innerHTML = svg(this.paused ? 'play' : 'pause');
    this.pauseBtn.title = this.paused ? t('继续') : t('暂停');
    this.pauseBtn.classList.toggle('on', this.paused);
    if (!this.paused) { this.pending = 0; this.rerender(); }
    this.updateState();
  }
  clear() { this.buf = []; this.queue = []; this.pending = 0; this.list.replaceChildren(); this.updateState(); }
  save() {
    const lines = this.buf.filter(e => this.match(e)).map(e => e.raw);
    if (!lines.length) { toast(t('没有可保存的日志')); return; }
    const name = (this.v.dev.model || this.v.dev.serial).replace(/[^\w.-]/g, '_');
    const a = h('a', { href: URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/plain' })), download: `${name}-logcat-${new Date().toISOString().replace(/\D/g, '').slice(0, 14)}.txt` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(t('已保存 {0} 行日志', lines.length));
  }
}

  }

  connect() {
    this.closed = false; this.gotFrame = false; this.pendingConfig = null; this.needKey = true; this.errorShown = false;
    this.showOverlay(t('正在连接…'), { spin: true });
    this.setDot('warn');
    const ws = this.ws = new WebSocket(this.wsUrl());
    ws.binaryType = 'arraybuffer';
    ws.onmessage = e => typeof e.data === 'string' ? this.onText(JSON.parse(e.data)) : this.onBinary(e.data);
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.setDot('bad');
      if (!this.closed && !this.errorShown) this.showOverlay(t('连接已断开'), { retry: true });
    };
  }
  reconnect() { this.teardown(); this.connect(); if (this.log) this.log.connect(); }
  teardown() {
    if (this.ws) { const w = this.ws; this.ws = null; try { w.close(); } catch {} }
    if (this.decoder && this.decoder.state !== 'closed') try { this.decoder.close(); } catch {}
    this.decoder = null; this.decoderReady = false;
    if (this.pendingFrame) { this.pendingFrame.close(); this.pendingFrame = null; }
  }
  close() {
    this.closed = true;
    if (this.log) this.log.destroy();
    this.teardown();
    clearInterval(this.statTimer);
    if (document.fullscreenElement === this.root) document.exitFullscreen();
    this.root.remove();
    viewers.delete(this.key);
    afterViewersChange();
  }

  setDot(c) { this.dot.className = 'dot ' + c; }
  showOverlay(text, { spin, retry } = {}) {
    this.overlay.replaceChildren(...[spin ? h('div', { class: 'spin' }) : null, h('div', {}, text),
      retry ? h('button', { class: 'btn', type: 'button', onclick: () => this.reconnect() }, t('重新连接')) : null].filter(Boolean));
    this.overlay.classList.remove('hide');
  }

  toggleLog(force) {
    const open = force === undefined ? !this.log : force;
    if (open && !this.log) { this.log = new LogPanel(this); this.vlog.append(this.log.el); }
    if (!open && this.log) { this.log.destroy(); this.log = null; this.vlog.replaceChildren(); }
    this.root.classList.toggle('with-log', !!this.log);
    this.logBtn.classList.toggle('on', !!this.log);
    this.fit();
  }

  // 桌面端布局：窗口宽度跟随画面比例；打开日志时，空间够就放右侧，横屏设备且空间不够时放到画面下方
  fit() {
    const r = this.root;
    if (!this.vw || !this.vh || isMobile()) { r.style.width = ''; this.vlog.style.width = ''; r.classList.remove('log-bottom'); return; }
    const avail = $('main').clientWidth - 32;
    const cw = Math.min(this.vw, (innerHeight - 150) * this.vw / this.vh);
    if (!this.log) { r.classList.remove('log-bottom'); r.style.width = Math.round(Math.max(300, Math.min(cw + 46, avail))) + 'px'; return; }
    const side = avail - (cw + 46);
    const portrait = this.vh >= this.vw;
    if (side >= 360 || portrait || avail - 46 - 400 >= cw * 0.7) {
      const lw = Math.round(Math.max(side >= 360 ? Math.min(side, 900) : 400, 360));
      r.classList.remove('log-bottom');
      this.vlog.style.width = lw + 'px';
      r.style.width = Math.round(Math.min(avail, cw + 46 + lw)) + 'px';
    } else {
      r.classList.add('log-bottom');
      this.vlog.style.width = '';
      r.style.width = Math.round(avail) + 'px';
    }
  }

  onText(m) {
    switch (m.type) {
      case 'status': if (!this.gotFrame) this.showOverlay(m.msg, { spin: true }); break;
      case 'meta': if (m.device_name) this.nameEl.textContent = m.device_name; this.showOverlay(t('等待画面…'), { spin: true }); break;
      case 'session':
        this.vw = m.width; this.vh = m.height;
        if (this.canvas.width !== m.width || this.canvas.height !== m.height) { this.canvas.width = m.width; this.canvas.height = m.height; }
        this.fit();
        break;
      case 'error': this.errorShown = true; this.setDot('bad'); this.showOverlay(m.msg, { retry: true }); break;
      case 'log': console.log('[' + this.dev.serial + ']', m.msg); break;
      case 'clipboard':
        if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(m.text).then(() => toast(t('已同步手机剪贴板')), () => {});
        break;
    }
  }

  ensureDecoder() {
    if (this.decoder && this.decoder.state !== 'closed') return;
    this.decoder = new VideoDecoder({
      output: f => this.onFrame(f),
      error: () => { this.decoderReady = false; this.needKey = true; this.requestKeyFrame(); },
    });
  }
  requestKeyFrame() {
    const now = performance.now();
    if (now - this.lastKeyReq < 1000) return;
    this.lastKeyReq = now;
    this.send({ t: 'cmd', name: 'reset_video' });
  }
  onBinary(buf) {
    if (!window.VideoDecoder) return;
    this.bytes += buf.byteLength;
    const dv = new DataView(buf);
    const flags = dv.getUint8(0);
    const pts = Number(dv.getBigUint64(1));
    let data = new Uint8Array(buf, 9);
    if (flags & 1) {
      this.pendingConfig = data.slice();
      this.ensureDecoder();
      try { this.decoder.configure({ codec: avcCodecString(data) || 'avc1.42E01F', optimizeForLatency: true }); this.decoderReady = true; }
      catch (e) { this.showOverlay(t('解码器不支持此视频：') + e.message, { retry: true }); }
      return;
    }
    let isKey = !!(flags & 2);
    if (this.pendingConfig) {
      const merged = new Uint8Array(this.pendingConfig.length + data.length);
      merged.set(this.pendingConfig); merged.set(data, this.pendingConfig.length);
      data = merged; isKey = true; this.pendingConfig = null;
    }
    if (!this.decoderReady) { this.requestKeyFrame(); return; }
    if (this.needKey && !isKey) { this.requestKeyFrame(); return; }
    if (!isKey && this.decoder.decodeQueueSize > 8) { this.needKey = true; this.requestKeyFrame(); return; }
    this.needKey = false;
    try { this.decoder.decode(new EncodedVideoChunk({ type: isKey ? 'key' : 'delta', timestamp: pts, data })); }
    catch { this.needKey = true; this.requestKeyFrame(); }
  }
  onFrame(frame) {
    if (this.pendingFrame) this.pendingFrame.close();
    this.pendingFrame = frame;
    if (!this.raf) this.raf = requestAnimationFrame(() => this.draw());
  }
  draw() {
    this.raf = 0;
    const f = this.pendingFrame; if (!f) return;
    this.pendingFrame = null;
    const w = f.displayWidth, ht = f.displayHeight;
    if (this.canvas.width !== w || this.canvas.height !== ht) { this.canvas.width = w; this.canvas.height = ht; this.vw = w; this.vh = ht; this.fit(); }
    if (!this.vw) { this.vw = w; this.vh = ht; }
    this.ctx.drawImage(f, 0, 0, w, ht);
    f.close();
    this.frames++;
    if (!this.gotFrame) { this.gotFrame = true; this.overlay.classList.add('hide'); this.setDot('ok'); }
  }
  updateStat() {
    if (!this.gotFrame) { this.statEl.textContent = ''; return; }
    this.statEl.textContent = this.frames + ' fps';
    this.statEl.title = `${this.vw}×${this.vh} · ${(this.bytes * 8 / 1e6).toFixed(1)} Mbps`;
    this.frames = 0; this.bytes = 0;
  }

  send(obj) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(obj)); }
  pressKey(code, meta = 0) { this.send({ t: 'key', action: 0, code, meta }); this.send({ t: 'key', action: 1, code, meta }); }
  toggleTyping() {
    const show = !this.typing.classList.contains('show');
    this.typing.classList.toggle('show', show);
    this.kbBtn.classList.toggle('on', show);
    if (show) this.textInput.focus(); else this.canvas.focus({ preventScroll: true });
  }
  async paste() {
    let text = null;
    try { if (navigator.clipboard && isSecureContext) text = await navigator.clipboard.readText(); } catch {}
    if (text === null) text = await promptDialog(t('粘贴到手机'), t('浏览器无法读取剪贴板，请在这里粘贴内容。'), { okText: t('发送') });
    if (text) this.send({ t: 'clipboard', text, paste: true });
  }
  screenshot() {
    if (!this.gotFrame) return;
    this.canvas.toBlob(b => {
      if (!b) return;
      const a = h('a', { href: URL.createObjectURL(b), download: `${(this.dev.model || this.dev.serial).replace(/[^\w.-]/g, '_')}-${new Date().toISOString().replace(/\D/g, '').slice(0, 14)}.png` });
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast(t('截图已保存'));
    }, 'image/png');
  }
  fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (this.root.requestFullscreen) this.root.requestFullscreen().catch(() => {});
  }

  async upload(files) {
    for (const f of files) {
      const apk = /\.apk$/i.test(f.name);
      const tt = toast((apk ? t('正在安装 ') : t('正在传输 ')) + f.name + '…', { sticky: true });
      try {
        const qs = new URLSearchParams({ serial: this.dev.serial, peer: this.host.id, name: f.name, lang: LANG });
        const r = await fetch(withToken('/api/push?' + qs), { method: 'POST', body: f });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        tt.set(j.msg || t('完成'), 'ok');
      } catch (e) { tt.set((apk ? t('安装失败：') : t('传输失败：')) + e.message, 'bad'); }
      tt.close(4500);
    }
  }
  bindDrop() {
    let depth = 0;
    const r = this.root;
    r.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { depth++; r.classList.add('dropping'); } });
    r.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; r.classList.remove('dropping'); } });
    r.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    r.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation(); depth = 0; r.classList.remove('dropping');
      const files = [...(e.dataTransfer.files || [])];
      if (files.length) this.upload(files);
    });
  }

  pos(e) {
    const r = this.canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / r.width * this.vw);
    const y = Math.round((e.clientY - r.top) / r.height * this.vh);
    return { x: Math.max(0, Math.min(this.vw - 1, x)), y: Math.max(0, Math.min(this.vh - 1, y)), w: this.vw, h: this.vh };
  }
  bindInput() {
    const c = this.canvas;
    const pid = e => e.pointerType === 'mouse' ? -2 : (e.pointerId % 0x7fffffff);
    const touch = (e, action) => {
      if (!this.vw) return;
      this.send({ t: 'touch', action, id: pid(e), ...this.pos(e), p: action === 1 ? 0 : (e.pressure || 1) });
    };
    c.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault(); c.focus({ preventScroll: true });
      c.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, true);
      touch(e, 0);
    });
    c.addEventListener('pointermove', e => {
      if (!this.pointers.has(e.pointerId)) return;
      e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      for (const ev of (evs.length ? evs : [e])) touch(ev, 2);
    });
    const up = e => { if (!this.pointers.has(e.pointerId)) return; this.pointers.delete(e.pointerId); touch(e, 1); };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
    c.addEventListener('contextmenu', e => { e.preventDefault(); this.send({ t: 'back', action: 0 }); this.send({ t: 'back', action: 1 }); });
    c.addEventListener('auxclick', e => { if (e.button === 1) { e.preventDefault(); this.pressKey(AKEY.HOME); } });
    c.addEventListener('wheel', e => {
      if (!this.vw) return;
      e.preventDefault();
      const k = e.deltaMode === 1 ? 1 / 3 : 1 / 100, cl = v => Math.max(-16, Math.min(16, v));
      this.send({ t: 'scroll', ...this.pos(e), hs: cl(-e.deltaX * k), vs: cl(-e.deltaY * k) });
    }, { passive: false });
    c.addEventListener('keydown', e => {
      if (e.isComposing) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') { e.preventDefault(); this.paste(); return; }
      if (e.key === 'Escape' && !document.fullscreenElement) { e.preventDefault(); this.pressKey(AKEY.BACK); return; }
      if (e.ctrlKey && /^[a-z]$/i.test(e.key)) { e.preventDefault(); this.pressKey(29 + e.key.toLowerCase().charCodeAt(0) - 97, 0x3000); return; }
      const code = KEYMAP[e.key];
      if (code) { e.preventDefault(); this.send({ t: 'key', action: 0, code, repeat: e.repeat ? 1 : 0, meta: e.shiftKey ? 1 : 0 }); return; }
      if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); this.send({ t: 'text', text: e.key }); }
    });
    c.addEventListener('keyup', e => {
      const code = KEYMAP[e.key];
      if (code) { e.preventDefault(); this.send({ t: 'key', action: 1, code, meta: e.shiftKey ? 1 : 0 }); }
    });
  }
}

function openViewer(hst, dev) {
  const key = hst.id + '|' + dev.serial;
  if (isMobile()) document.body.classList.add('viewing');
  if (viewers.has(key)) { viewers.get(key).root.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
  if (!window.VideoDecoder) { showNotice(); toast(t('当前浏览器无法解码视频')); document.body.classList.remove('viewing'); return; }
  const v = new Viewer(hst, dev);
  viewers.set(key, v);
  $('#grid').append(v.root);
  afterViewersChange();
  history.replaceState(null, '', location.search + '#open=' + encodeURIComponent(hst.id) + '|' + encodeURIComponent(dev.serial));
  if (isMobile()) scrollTo(0, 0);
}

function afterViewersChange() {
  $('#placeholder').style.display = viewers.size ? 'none' : '';
  if (!viewers.size) { document.body.classList.remove('viewing'); history.replaceState(null, '', location.pathname + location.search); }
  renderSide();
}

function showNotice() {
  const text = !isSecureContext
    ? [t('当前通过 HTTP 访问，浏览器不允许解码视频。请改用 '), (() => {
        const port = (INFO && INFO.https_port) || 8731;
        const host = location.hostname.includes(':') ? '[' + location.hostname + ']' : location.hostname;
        const url = `https://${host}:${port}/`;
        return h('a', { href: url }, url);
      })(), t('（首次需在浏览器中选择继续访问）。')]
    : [t('当前浏览器不支持视频解码，请使用新版 Chrome、Edge 或 Safari。')];
  $('#notice').replaceChildren(h('div', { class: 'notice' }, h('span', { html: svg('alert') }).firstChild, h('div', {}, text)));
  if (isMobile()) $('#noticeSide').replaceChildren(h('div', { class: 'notice' }, h('span', { html: svg('alert') }).firstChild, h('div', {}, text.map(x => typeof x === 'string' ? x : x.cloneNode(true)))));
}

// ---------------- 初始化 ----------------
$('#logo').innerHTML = svg('phone');
$('#mLogo').innerHTML = svg('phone');
$('#gear').replaceWith(ib('gear', t('设置'), settingsDialog));
$('#mGear').replaceWith(ib('gear', t('设置'), settingsDialog, 'gear'));
$('#mBack').innerHTML = svg('chevLeft');
$('#mBack').onclick = () => document.body.classList.remove('viewing');
$('#placeholder').append(h('span', { html: svg('phone') }).firstChild, h('div', {}, t('选择设备开始投屏')), t('设备需开启 USB 调试并连接到电脑'));
addEventListener('resize', () => { for (const v of viewers.values()) v.fit(); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) toast(t('把文件拖到设备画面上即可安装或传输')); });

(async function init() {
  try {
    INFO = await api('/api/info');
    document.title = 'DroidBridge · ' + INFO.name;
  } catch (e) { toast(t('无法连接 DroidBridge：') + e.message, { kind: 'bad', ms: 5000 }); }
  if (!window.VideoDecoder || !isSecureContext) showNotice();
  await refreshAll();
  const m = location.hash.match(/^#open=([^|]+)\|(.+)$/);
  if (m) {
    const hst = hosts.get(decodeURIComponent(m[1])), serial = decodeURIComponent(m[2]);
    if (hst) openViewer(hst, (hst.devices || []).find(d => d.serial === serial) || { serial, model: '', state: 'device' });
  }
  setInterval(() => { if (!document.hidden) refreshAll(); }, 4000);
})();
</script>
