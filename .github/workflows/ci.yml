name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-14 }
          - { name: Linux, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build server
        run: cargo build --locked --bin droidbridge
      - name: Build desktop
        run: cargo build --locked --features desktop
      - name: Test
        run: cargo test --locked
      - name: Check web UI script
        if: runner.os == 'Linux'
        run: |
          node -e 'const s=require("fs").readFileSync("web/index.html","utf8");require("fs").writeFileSync("/tmp/ui.js",s.slice(s.indexOf("<script>")+8,s.lastIndexOf("</script>")))'
          node --check /tmp/ui.js
