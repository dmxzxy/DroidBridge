name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # apt 偶尔会长时间卡住：加超时，装不上时跳过桌面构建（服务版和测试仍会跑）
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build server
        run: cargo build --locked --bin droidbridge
      - name: Build desktop
        if: runner.os != 'Linux'
        run: cargo build --locked --features desktop
      - name: Build desktop (Linux)
        if: runner.os == 'Linux'
        run: |
          if pkg-config --exists webkit2gtk-4.1; then
            cargo build --locked --features desktop
          else
            echo "webkit2gtk-4.1 not available; skipping the Linux desktop build"
          fi
      - name: Test
        run: cargo test --locked
      - name: Check web UI
        if: runner.os == 'Linux'
        run: node tools/check-ui.js
      - name: Keyboard and IME test
        if: runner.os == 'Linux'
        run: node tools/test-input.js


