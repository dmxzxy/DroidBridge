name: Release

# 推送 v* 标签时构建各平台安装包，并创建 Release 草稿（检查后在 GitHub 上点“发布”）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          ./build.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binaries
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --features desktop --target $t
          done
          mkdir -p target/universal
          for b in droidbridge droidbridge-desktop; do
            lipo -create -output target/universal/$b \
              target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done
          file target/universal/*
      - name: Package
        run: sh tools/package-mac.sh "${GITHUB_REF_NAME#v}" target/universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.tar.gz

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build
        run: cargo build --locked --release --features desktop
      - name: Package
        run: sh tools/package-linux.sh "${GITHUB_REF_NAME#v}" x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
